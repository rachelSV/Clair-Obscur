<!-- Bouton rond flottant (mobile uniquement) -->
<button (click)="toggle()" class="fixed bottom-6 right-6 bg-paper-100 lg:hidden w-16 h-16 rounded-full bg-gold text-ink shadow-lg flex items-center justify-center text-sm z-40">
  Infos Utiles
</button>

<!-- Panneau latéral (mobile) -->
<div class="lg:hidden fixed inset-0 z-40" [class.hidden]="!isOpen">
  <!-- Voile -->
  <div class="absolute inset-0 bg-black/40" (click)="close()"></div>

  <!-- Contenu -->
  <div class="absolute top-0 right-0 h-full w-72 bg-paper border-l shadow-lg transform transition-transform duration-300" [class.translate-x-full]="!isOpen" [class.translate-x-0]="isOpen">
    <div class="p-4 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-semibold text-lg">Infos utiles</h3>
        <button (click)="close()" class="text-gray-600 text-xl font-bold">✕</button>
      </div>
    
      <p class="text-sm text-ink/70 italic">Ces plateformes, informations ou numéros peuvent vous être utiles, comme certains m'ont déjà aidés :</p>

      <ng-container *ngFor="let it of items">
        <a [href]="it.href" target="_blank" rel="noopener noreferrer" class="block bg-gold text-ink-soft p-3 rounded-lg shadow hover:shadow-md" (click)="close()">
          {{ it.label }}
        </a>
      </ng-container>
    </div>
  </div>
</div>

<!-- Aside desktop -->
<aside class="hidden lg:block col-span-3">
  <div class="bg-paper border rounded-lg p-4 shadow-soft space-y-4 sticky top-6">
    <h3 class="font-semibold text-md text-ink/90">Infos utiles</h3>
    <p class="text-sm text-ink/70 italic">Ces plateformes, informations ou numéros peuvent vous être utiles, comme certains m'ont déjà aidés :</p>
    <ng-container *ngFor="let it of items">
      <a [href]="it.href" target="_blank" rel="noopener noreferrer" class="block bg-gold text-ink/50 p-3 text-sm rounded-lg shadow hover:shadow-md">
        {{ it.label }}
      </a>
    </ng-container>
  </div>
</aside>
