<header class="bg-paper relative shadow-soft border-b border-mist">
  <div class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
    
    <!-- Logo / Titre -->
    <a href="/" class="flex items-center space-x-2">
      <img src="assets/images/logo.png" alt="logo" class="h-10" />
      <span class="text-2xl md:text-3xl font-serif bg-gold-sheen bg-clip-text text-transparent">Clair Obscur</span>
    </a>

    <!-- Bouton burger (mobile) -->
    <button (click)="toggleMenu()" class="md:hidden text-ink focus:outline-none">
      <!-- Icône burger -->
      <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>

      <!-- Icône croix -->
      <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Menu -->
    <nav class="hidden md:block">
      <ul class="flex space-x-8 text-ink-soft font-sans text-sm uppercase tracking-wide">
        <li><a href="#home" class="hover:text-gold-500 hover:underline underline-offset-4 transition">Accueil</a></li>
        <li><a href="#blog" class="hover:text-gold-500 hover:underline underline-offset-4 transition">Articles</a></li>
        <li><a href="#about" class="hover:text-gold-500 hover:underline underline-offset-4 transition">À propos</a></li>
        <li><a href="#contact" class="hover:text-gold-500 hover:underline underline-offset-4 transition">Contact</a></li>
      </ul>
    </nav>
  </div>

  <!-- Menu mobile -->
  <div *ngIf="isMenuOpen" class="absolute top-full left-0 w-full bg-paper border-t border-mist shadow-card z-50">
    <ul class="flex flex-col space-y-4 py-4 px-6 text-ink-soft font-sans text-base uppercase tracking-wide">
      <li><a href="#home" class="hover:text-gold-500 transition">Accueil</a></li>
      <li><a href="#blog" class="hover:text-gold-500 transition">Articles</a></li>
      <li><a href="#about" class="hover:text-gold-500 transition">À propos</a></li>
      <li><a href="#contact" class="hover:text-gold-500 transition">Contact</a></li>
    </ul>
  </div>

  <!-- Liseré doré -->
  <div class="h-1 bg-gold-sheen"></div>
</header>
